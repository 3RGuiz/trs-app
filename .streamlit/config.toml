[server]
address = "localhost"
port = 8501
headless = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[client]
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#f2c230"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#faf9f6"
textColor = "#2b2a28"
borderColor = "#e6e3da"
dataframeHeaderBackgroundColor = "#faf9f6"
font = "sans serif"
baseRadius = "0.4rem"
headingFontWeights = [700, 700, 600]

# Barre latérale reprenant le bandeau de la charte : fond jaune, encre noire.
[theme.sidebar]
backgroundColor = "#f2c230"
secondaryBackgroundColor = "#f7d564"
textColor = "#2b2a28"
primaryColor = "#2b2a28"
borderColor = "#dcae22"
