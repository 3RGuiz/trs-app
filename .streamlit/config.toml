# développement. L'application est locale, rien ne doit partir vers un cloud.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f9f9f7"
textColor = "#0b0b0b"
font = "sans serif"
