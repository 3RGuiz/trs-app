[server]
address = "localhost"
port = 8501
headless = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[client]
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#ffd400"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#faf9f6"
textColor = "#1e1f1c"
borderColor = "#e6e3da"
dataframeHeaderBackgroundColor = "#faf9f6"
font = "sans serif"
baseRadius = "0.4rem"
headingFontWeights = [700, 700, 600]

# Barre latérale reprenant le bandeau de la charte : fond jaune, encre noire.
[theme.sidebar]
backgroundColor = "#ffd400"
secondaryBackgroundColor = "#ffe15c"
textColor = "#1e1f1c"
primaryColor = "#1e1f1c"
borderColor = "#e0b900"
