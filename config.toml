# Paramètres non sensibles de l'application. Le chemin est relatif à ce dossier.
[base]
chemin = "data/trs.db"

[identite]
# Emplacement du logo affiché dans l'application. Chemin relatif au dossier de
# l'application, ou absolu — il peut pointer vers un dossier SharePoint
# synchronisé, ce qui évite d'avoir à recopier le fichier à chaque mise à jour
# de la charte. Le logo n'est jamais versionné (CLAUDE.md, règle 9).
logo = "assets/logo.png"

# Taille et cadre du logo dans la barre latérale. Ajustables sans toucher au
# code : relancez l'application pour voir l'effet.
logo_largeur = "90%"          # part de la largeur de la barre
logo_largeur_max = "260px"    # plafond, pour ne pas déborder
logo_marge = "0.85rem 1rem"   # épaisseur du contour blanc (haut/bas, côtés)
logo_arrondi = "0.9rem"       # arrondi des coins de la carte blanche
